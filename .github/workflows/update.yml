name: Update projections

on:
  schedule:
    # 1:00 AM, 11:00 AM and 6:00 PM ET. Each is listed at both the EST and EDT UTC hours;
    # the gate job below lets only the one that matches the real ET hour through.
    - cron: "0 5,6 * * *"
    - cron: "0 15,16 * * *"
    - cron: "0 22,23 * * *"
  workflow_dispatch:        # run by hand from the Actions tab any time

permissions:
  contents: write

concurrency:
  group: update-projections
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          H=$(TZ=America/New_York date +%H)
          D=$(TZ=America/New_York date +%F)
          echo "ET hour is $H on $D"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "01" ] || [ "$H" = "11" ] || [ "$H" = "18" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the Odds API key with the most credits left
        env:
          K1: ${{ secrets.ODDS_API_KEY1 }}
          K2: ${{ secrets.ODDS_API_KEY }}
        run: |
          # Free balance check on both plans' keys (the events list costs 0 credits); use the one with more left.
          best=""; best_rem=-1; bi=0; i=0
          for k in "$K1" "$K2"; do
            i=$((i+1)); [ -z "$k" ] && continue
            rem=$(curl -s -D - -o /dev/null "https://api.the-odds-api.com/v4/sports/basketball_nba/events?apiKey=$k" \
                  | tr -d '\r' | awk -F': ' 'tolower($1)=="x-requests-remaining"{print int($2)}')
            echo "key $i: ${rem:-unavailable} credits left"
            if [ -n "$rem" ] && [ "$rem" -gt "$best_rem" ]; then best="$k"; best_rem=$rem; bi=$i; fi
          done
          if [ -n "$best" ]; then
            echo "::add-mask::$best"
            echo "ODDS_API_KEY=$best" >> "$GITHUB_ENV"
            echo "using key $bi"
            # the daily share of the plan is based on the key actually in use
            python -c "import json,sys;p='data/credits.json';d=json.load(open(p));d['remaining']=int(sys.argv[1]);json.dump(d,open(p,'w'),indent=1)" "$best_rem" || true
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model
        env:
          # The key picked above (most credits left); falls back to ODDS_API_KEY1, then ODDS_API_KEY.
          ODDS_API_KEY: ${{ env.ODDS_API_KEY || secrets.ODDS_API_KEY1 || secrets.ODDS_API_KEY }}
          # Hard cap on Odds API credits per day (ET). Change it under Settings > Secrets and variables > Actions > Variables.
          DAILY_CREDIT_LIMIT: ${{ vars.DAILY_CREDIT_LIMIT || '250' }}
          MONTHLY_CREDIT_LIMIT: ${{ vars.MONTHLY_CREDIT_LIMIT || '5500' }}
          ODDS_RESET_DAY: ${{ vars.ODDS_RESET_DAY || '4' }}   # plan upgraded Nov 4, so it resets on the 4th
          # Daily Discord alerts (Pick of the Day + ladder at 11 AM, results at 1 AM). Add the webhook under
          # Settings > Secrets and variables > Actions > New repository secret, named DISCORD_WEBHOOK_URL.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python update_projections.py

      - name: Sanity-check output
        run: python -c "import json; d=json.load(open('projections_data.json')); assert d.get('games') is not None and d.get('props') is not None; print('ok', d.get('generated_at'))"

      - name: Commit updated data
        run: |
          git config user.name "pj-model-bot"
          git config user.email "pj-model-bot@users.noreply.github.com"
          git add projections_data.json player_games.json data
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update $(date -u +%F-%H%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
