name: Update projections

on:
  schedule:
    # 3 refreshes a day: 10 AM, 2 PM and 5 PM ET. An outside timer (cron-job.org) starts each one on time through
    # workflow_dispatch with scheduled=true. These GitHub checks are the backup in case the timer misses: they run
    # at :20 and :50, and the gate lets each slot through once a day, so a slot never refreshes twice.
    - cron: "20,50 14-23 * * *"
    # Free tip-off checks at about 7:30, 8:30, 9:30 and 10:30 PM ET: 0 credits. They reload injuries from ESPN and
    # re-check today's picks with the lines already saved. A pick only changes if its player is ruled out or a
    # clearly better pick shows up.
    - cron: "30 0,1,2,3 * * *"
  workflow_dispatch:        # run by hand from the Actions tab any time
    inputs:
      off_daily_cap:
        description: "One time only: keep this run's credits off today's daily cap (they still count toward the month)"
        type: boolean
        default: false
      scheduled:
        description: "Timer run: counts as this slot's refresh and is skipped if the slot already ran today"
        type: boolean
        default: false
      free_run:
        description: "Free run: 0 credits. Re-picks with the lines already saved today (no Odds API calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-projections
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      free: ${{ steps.check.outputs.free }}
      slot: ${{ steps.check.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: data
      - id: check
        run: |
          H=$(TZ=America/New_York date +%H)
          D=$(TZ=America/New_York date +%F)
          echo "ET hour is $H on $D"
          if [ "${{ github.event.schedule }}" = "30 0,1,2,3 * * *" ]; then
            # free tip-off check: only 7-10 PM ET, and never a paid run
            if [ "$H" = "19" ] || [ "$H" = "20" ] || [ "$H" = "21" ] || [ "$H" = "22" ]; then
              echo "Free tip-off check"; echo "go=true" >> "$GITHUB_OUTPUT"; echo "free=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.free_run }}" = "true" ]; then
            echo "Free run by hand"; echo "go=true" >> "$GITHUB_OUTPUT"; echo "free=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paid runs (10 AM, 2 PM, 5 PM ET). Each slot has a window instead of an exact hour, and runs once a day.
          H10=$((10#$H))
          if [ "$H10" -ge 10 ] && [ "$H10" -le 13 ]; then SLOT=am
          elif [ "$H10" -ge 14 ] && [ "$H10" -le 16 ]; then SLOT=mid
          elif [ "$H10" -ge 17 ]; then SLOT=pm
          else SLOT=""; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.scheduled }}" != "true" ]; then
            # A run by hand always goes, and counts as this slot's run if it lands inside a window.
            echo "go=true" >> "$GITHUB_OUTPUT"
            if [ -n "$SLOT" ] && ! grep -qx "$D $SLOT" data/paid_slots.txt 2>/dev/null; then echo "slot=$D $SLOT" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ -z "$SLOT" ]; then
            echo "Outside the paid windows"; echo "go=false" >> "$GITHUB_OUTPUT"
          elif grep -qx "$D $SLOT" data/paid_slots.txt 2>/dev/null; then
            echo "The $SLOT run already happened on $D"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Paid $SLOT run for $D"; echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=$D $SLOT" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pick the Odds API key with the most credits left
        if: needs.gate.outputs.free != 'true'
        env:
          K1: ${{ secrets.ODDS_API_KEY1 }}
          K2: ${{ secrets.ODDS_API_KEY }}
        run: |
          # Free balance check on both plans' keys (the events list costs 0 credits); use the one with more left.
          best=""; best_rem=-1; bi=0; i=0
          for k in "$K1" "$K2"; do
            i=$((i+1)); [ -z "$k" ] && continue
            rem=$(curl -s -D - -o /dev/null "https://api.the-odds-api.com/v4/sports/basketball_nba/events?apiKey=$k" \
                  | tr -d '\r' | awk -F': ' 'tolower($1)=="x-requests-remaining"{print int($2)}')
            echo "key $i: ${rem:-unavailable} credits left"
            if [ -n "$rem" ] && [ "$rem" -gt "$best_rem" ]; then best="$k"; best_rem=$rem; bi=$i; fi
          done
          if [ -n "$best" ]; then
            echo "::add-mask::$best"
            echo "ODDS_API_KEY=$best" >> "$GITHUB_ENV"
            echo "using key $bi"
            # the daily share of the plan is based on the key actually in use
            python -c "import json,sys;p='data/credits.json';d=json.load(open(p));d['remaining']=int(sys.argv[1]);json.dump(d,open(p,'w'),indent=1)" "$best_rem" || true
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model
        env:
          # The key picked above (most credits left); falls back to ODDS_API_KEY1, then ODDS_API_KEY.
          ODDS_API_KEY: ${{ env.ODDS_API_KEY || secrets.ODDS_API_KEY1 || secrets.ODDS_API_KEY }}
          # 1 on the free tip-off checks: the script makes no Odds API calls at all
          NO_PAID_CALLS: ${{ needs.gate.outputs.free == 'true' && '1' || '' }}
          OFF_DAILY_CAP: ${{ github.event.inputs.off_daily_cap == 'true' && '1' || '' }}
          # Hard cap on Odds API credits per day (ET). Change it under Settings > Secrets and variables > Actions > Variables.
          DAILY_CREDIT_LIMIT: ${{ vars.DAILY_CREDIT_LIMIT || '250' }}
          MONTHLY_CREDIT_LIMIT: ${{ vars.MONTHLY_CREDIT_LIMIT || '5500' }}
          ODDS_RESET_DAY: ${{ vars.ODDS_RESET_DAY || '4' }}   # plan upgraded Nov 4, so it resets on the 4th
          # Daily Discord alerts (Pick of the Day + ladder at 11 AM, results at 1 AM). Add the webhook under
          # Settings > Secrets and variables > Actions > New repository secret, named DISCORD_WEBHOOK_URL.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python update_projections.py

      - name: Sanity-check output
        run: python -c "import json; d=json.load(open('projections_data.json')); assert d.get('games') is not None and d.get('props') is not None; print('ok', d.get('generated_at'))"

      - name: Mark this paid slot as done
        if: needs.gate.outputs.slot != ''
        run: echo "${{ needs.gate.outputs.slot }}" >> data/paid_slots.txt

      - name: Commit updated data
        run: |
          git config user.name "pj-model-bot"
          git config user.email "pj-model-bot@users.noreply.github.com"
          git add projections_data.json player_games.json data
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update $(date -u +%F-%H%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
